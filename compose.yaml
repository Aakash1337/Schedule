name: schedule

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: schedule
      POSTGRES_USER: schedule
      POSTGRES_PASSWORD: schedule
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schedule -d schedule"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - schedule_postgres_data:/var/lib/postgresql/data

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: 4000
      DATABASE_URL: postgres://schedule:schedule@postgres:5432/schedule
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://schedule:schedule@postgres:5432/schedule
      OUTBOX_POLL_INTERVAL_MS: 1000
      OUTBOX_BATCH_SIZE: 25
      OUTBOX_MAX_ATTEMPTS: 8
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  schedule_postgres_data:
