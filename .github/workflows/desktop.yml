name: desktop

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/desktop.yml"
      - "apps/api/**"
      - "apps/desktop/**"
      - "apps/worker/**"
      - "packages/**"
      - "scripts/build-desktop-runtime.ts"
      - "scripts/build-desktop-runtime.test.ts"
      - "scripts/stage-desktop-service-deployments.ts"
      - "scripts/stage-desktop-service-deployments.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - ".nvmrc"
      - ".prettierignore"
      - "eslint.config.mjs"
  pull_request:
    paths:
      - ".github/workflows/desktop.yml"
      - "apps/api/**"
      - "apps/desktop/**"
      - "apps/worker/**"
      - "packages/**"
      - "scripts/build-desktop-runtime.ts"
      - "scripts/build-desktop-runtime.test.ts"
      - "scripts/stage-desktop-service-deployments.ts"
      - "scripts/stage-desktop-service-deployments.test.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "tsconfig.base.json"
      - ".nvmrc"
      - ".prettierignore"
      - "eslint.config.mjs"

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    name: Compile (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf
      - name: Install Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup component add rustfmt
      - run: pnpm install --frozen-lockfile
      - name: Verify deterministic runtime assembly
        run: pnpm exec vitest run scripts/build-desktop-runtime.test.ts
      - name: Verify portable service deployment staging
        run: pnpm exec vitest run scripts/stage-desktop-service-deployments.test.ts
      - name: Build deployable desktop services
        run: |
          pnpm build:packages
          pnpm --filter @schedule/api build
          pnpm --filter @schedule/worker build
      - name: Verify desktop API protocol
        run: pnpm --filter @schedule/api exec vitest run src/desktop-api-runtime.test.ts
      - name: Verify desktop worker protocol
        run: pnpm --filter @schedule/worker exec vitest run src/desktop-worker-runtime.test.ts
      - name: Verify desktop frontend and supervisor
        run: pnpm desktop:check
      - name: Check Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml --check
      - name: Compile native application
        run: pnpm --filter @schedule/desktop exec tauri build --no-bundle
      - name: Smoke real pnpm 11.7 service deployment staging
        shell: bash
        run: |
          output="$RUNNER_TEMP/schedule desktop staging & smoke"
          pnpm desktop:runtime:stage-services "$output"
          node -e "const fs = require('node:fs'); const path = require('node:path'); for (const file of ['api/dist/server.js', 'worker/dist/index.js']) if (!fs.statSync(path.join(process.argv[1], file)).isFile()) process.exit(1)" "$output"
